account: DivokaSarka
# Import attempts, including uncertain outcomes, per rolling 24 hours.
daily_budget: 500
# Conservative combined ceiling: live plays reduce import capacity.
# This is a local policy, NOT a claim about Last.fm's actual limit.
combined_budget: 500
batch_size: 50
minimum_played_ms: 30000
exclude_skipped: false
# Spotify lacks full track duration. 30s is a configurable import proxy.
# Set 240000 for a conservative four-minute threshold.
timestamp_age_days: 2
# Seconds between consecutive imported scrobbles (1..600).
timestamp_spacing_seconds: 1
# After each batch, wait this long, then confirm it in account history.
verify_delay_seconds: 30
# Last.fm keeps at most ~750 scrobbles per calendar day of their timestamp and
# silently drops the rest while reporting them accepted (observed 2026-10-09).
# Imports fill finished days up to this cap, counted in UTC and account_timezone.
max_scrobbles_per_day: 740
account_timezone: "Europe/Warsaw"
day_settle_hours: 2
request_interval_seconds: 1.0
poll_seconds: 3600
# Plays ending at/after this UTC instant were already scrobbled live by the
# Spotify→Last.fm connection; they are excluded as live_scrobbled_period and
# only re-included through `gap-review`. Find it with sync-history --full.
# Remove this line (and run reclassify) if your account has no live scrobbles.
live_scrobbling_since: "2025-11-11T20:58:40Z"
overrides:
  - spotify_track_id: "1nU1x5TSTtj0zXYtQZ7tQd"
    artist: "AL-90"
    track: "радикальные танцы"
# Continuous mode snapshots before writing and keeps seven automatic snapshots.
backup_interval_hours: 24
backup_keep: 7
