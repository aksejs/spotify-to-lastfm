[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-history-import"
version = "0.1.0"
description = "Resumable, auditable Spotify history importer for Last.fm"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
spotify-import = "spotify_import.cli:main"

[tool.setuptools.packages.find]
include = ["spotify_import*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
